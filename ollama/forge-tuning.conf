# Forge IDE tuning for the Googlebook (8 cores, 7.6 GB RAM in the Linux VM). Written 2026-10-14.
[Service]
# Flash attention plus an 8-bit KV cache halves the memory the context window needs (8192 tokens: 1 GB -> 0.5 GB)
# with no measurable quality loss, which leaves headroom so the model never swaps.
Environment="OLLAMA_FLASH_ATTENTION=1"
Environment="OLLAMA_KV_CACHE_TYPE=q8_0"
# One request slot: all memory and the prompt cache belong to the single active conversation.
Environment="OLLAMA_NUM_PARALLEL=1"
Environment="OLLAMA_MAX_LOADED_MODELS=1"
# Keep the model in memory for 20 minutes after the last request (a loaded model is 5.2 GB of the VM's 7.8 GB) so the IDE stays responsive.
Environment="OLLAMA_KEEP_ALIVE=20m"
Environment="OLLAMA_MAX_QUEUE=64"
