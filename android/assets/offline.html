<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forge</title>
<style>
  body { margin: 0; background: #0f1117; color: #d7dbe7; font: 15px/1.5 -apple-system, Roboto, "Segoe UI", sans-serif; display: grid; place-items: center; height: 100vh; }
  .box { max-width: 520px; text-align: center; padding: 24px; }
  .logo { display: inline-grid; place-items: center; width: 64px; height: 64px; border-radius: 16px; background: linear-gradient(135deg, #ff8a3d, #ff5e62); color: #fff; font-weight: 900; font-size: 34px; margin-bottom: 12px; }
  h1 { font-size: 22px; margin: 6px 0; }
  p { color: #a7adbf; }
  .btn { display: inline-block; margin: 8px 6px 0; padding: 10px 18px; border-radius: 8px; background: #ff8a3d; color: #1a1000; font-weight: 600; text-decoration: none; border: 0; font-size: 15px; cursor: pointer; }
  .btn.ghost { background: #222738; color: #d7dbe7; }
  .status { margin-top: 14px; font-size: 13px; color: #717896; min-height: 20px; }
  ol { text-align: left; color: #a7adbf; }
</style></head>
<body><div class="box">
  <div class="logo">F</div>
  <h1>Forge is not running yet</h1>
  <p>Forge runs inside the Linux Terminal. This window opens the Terminal for you when nothing answers, waits for its VM to boot (about half a minute), and shows the IDE by itself as soon as Forge answers. The Terminal can stay in the background.</p>
  <button class="btn" onclick="ForgeApp.retry()">Check now</button>
  <button class="btn ghost" onclick="ForgeApp.openTerminal()">Open the Terminal</button>
  <div class="status" id="status">Checking…</div>
  <div class="status" id="hint"></div>
</div>
<script>
  // The app probes the server itself and reports here; this page never reloads, so the buttons always work.
  window.ForgeOffline = {
    update: function (s) {
      document.getElementById('status').textContent = 'Checking every ' + s.every + ' seconds… (' + s.probes + (s.seconds >= 60 ? ', ' + Math.floor(s.seconds / 60) + ' min ' + (s.seconds % 60) + ' s' : ', ' + s.seconds + ' s') + ')';
      document.getElementById('hint').textContent = s.terminalOpened
        ? 'The Terminal was opened. Its VM boots in about half a minute and starts Forge with it; if the Terminal shows a question, answer it there.'
        : '';
    }
  };
</script>
</body></html>
